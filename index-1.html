<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>순감타로 · 인연의 수레바퀴</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&display=swap');

  :root{
    --hanji:#F5EFE2;
    --ink:#2B2721;
    --ink-soft:#6E675C;
    --cinnabar:#BE3B2E;
    --indigo:#2E5A86;
    --jade:#4A8073;
    --gardenia:#DFA93F;
    --plum:#8E4763;
    --gold:#C9A227;
    --line:#E0D6C2;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    background:
      radial-gradient(900px 520px at 50% -8%, #FBF7EC 0%, transparent 70%),
      radial-gradient(600px 400px at 88% 105%, #F0E6D2 0%, transparent 70%),
      var(--hanji);
    font-family:"Gowun Batang","Apple SD Gothic Neo","Malgun Gothic",serif;
  }
  /* 색동 띠 */
  body::before{
    content:""; position:fixed; top:0; left:0; right:0; height:5px; z-index:20;
    background:linear-gradient(90deg,
      var(--indigo) 0 20%, var(--cinnabar) 20% 40%, var(--gardenia) 40% 60%,
      var(--jade) 60% 80%, var(--plum) 80% 100%);
  }
  .wrap{max-width:1060px; margin:0 auto; padding:34px 18px 64px}

  header{text-align:center; margin-bottom:16px}
  .fairy{width:min(148px,40vw); height:auto; display:block; margin:0 auto -2px;
    animation:float 5s ease-in-out infinite; filter:drop-shadow(0 6px 10px rgba(43,39,33,.10))}
  @keyframes float{0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)}}
  @media(prefers-reduced-motion:reduce){ .fairy{animation:none} }
  .orn{display:flex; align-items:center; justify-content:center; gap:12px; color:var(--gold)}
  .orn i{display:block; height:1px; width:min(140px,20vw); background:linear-gradient(90deg,transparent,var(--gold))}
  .orn i.r{background:linear-gradient(270deg,transparent,var(--gold))}
  .orn span{color:var(--cinnabar); font-size:11px}
  .brand{
    font-family:"Nanum Myeongjo",serif; font-weight:800;
    font-size:clamp(34px,7vw,52px); letter-spacing:.1em; margin:10px 0 4px; color:var(--ink);
  }
  .tagline{font-size:12px; letter-spacing:.34em; color:var(--ink-soft); margin:0}

  .modes{display:flex; margin:22px auto 28px; max-width:380px;
    border:1px solid var(--line); border-radius:999px; overflow:hidden; background:#fff}
  .modes button{
    flex:1; font-family:inherit; font-size:14px; padding:11px 8px; cursor:pointer;
    background:transparent; border:none; color:var(--ink-soft);
  }
  .modes button.on{background:var(--cinnabar); color:#FBF7EE; font-weight:700}

  .grid{display:grid; grid-template-columns:1fr; gap:32px; align-items:start}
  @media(min-width:940px){ .grid{grid-template-columns:1fr 330px} }
  body.stage-mode .grid{grid-template-columns:1fr}
  body.stage-mode aside, body.stage-mode .modes{display:none}

  .stage{display:flex; flex-direction:column; align-items:center}
  .wheelbox{position:relative; width:100%; max-width:430px}
  body.stage-mode .wheelbox{max-width:min(560px,70vh)}
  .needle{position:absolute; top:-12px; left:50%; transform:translateX(-50%); z-index:3;
    filter:drop-shadow(0 3px 5px rgba(43,39,33,.28))}
  #wheel{width:100%; display:block; filter:drop-shadow(0 14px 30px rgba(43,39,33,.16))}
  #rotor{transform-origin:150px 150px}
  .empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:14px; text-align:center; padding:0 76px; line-height:1.7}

  #spin{
    margin-top:24px; padding:15px 52px; font-family:"Nanum Myeongjo",serif; font-weight:800;
    font-size:21px; letter-spacing:.16em; cursor:pointer; border-radius:999px;
    color:#FBF7EE; background:linear-gradient(180deg,#CC4636,#A93024);
    border:1px solid #96291F; box-shadow:0 5px 0 #7E2119;
  }
  #spin:active{transform:translateY(3px); box-shadow:0 2px 0 #7E2119}
  #spin:disabled{background:#D8D0C0; border-color:#C7BEAA; color:#8C857A; box-shadow:none; cursor:not-allowed; transform:none}
  .tally{margin-top:14px; font-size:12.5px; letter-spacing:.06em; color:var(--ink-soft); min-height:18px}
  .hintkey{font-size:11px; color:#A29A8C; margin:4px 0 0}

  .result{min-height:196px; margin-top:20px; display:flex; align-items:center; justify-content:center; perspective:900px}
  .card{
    position:relative; width:min(340px,88vw); padding:26px 22px 18px; text-align:center;
    background:#FFFDF7; border:1px solid var(--cinnabar); border-radius:6px; overflow:hidden;
    box-shadow:0 0 0 4px #FFFDF7, 0 0 0 5px rgba(201,162,39,.55), 0 16px 34px rgba(43,39,33,.18);
    animation:rise 620ms cubic-bezier(.2,.9,.25,1) both;
  }
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:5px;
    background:linear-gradient(90deg,
      var(--indigo) 0 20%, var(--cinnabar) 20% 40%, var(--gardenia) 40% 60%,
      var(--jade) 60% 80%, var(--plum) 80% 100%);
  }
  .card .eye{font-size:11px; letter-spacing:.4em; color:var(--cinnabar); margin:6px 0 12px}
  .card .name{font-family:"Nanum Myeongjo",serif; font-weight:800;
    font-size:clamp(24px,5.4vw,32px); line-height:1.35; margin:0; word-break:break-all}
  .card .foot{font-size:11px; letter-spacing:.2em; color:var(--ink-soft); margin:14px 0 0}
  @keyframes rise{
    from{transform:rotateX(-84deg) translateY(24px); opacity:0}
    to{transform:rotateX(0) translateY(0); opacity:1}
  }
  @media(prefers-reduced-motion:reduce){ .card{animation:none} }

  .backcard{
    position:relative; width:min(340px,88vw); padding:40px 22px 34px; text-align:center;
    background:#FFFDF7; border:1px solid var(--line); border-radius:6px; overflow:hidden;
    box-shadow:0 0 0 4px #FFFDF7, 0 0 0 5px rgba(201,162,39,.35), 0 16px 34px rgba(43,39,33,.14);
  }
  .backcard::before{
    content:""; position:absolute; top:0; left:0; right:0; height:5px;
    background:linear-gradient(90deg,
      var(--indigo) 0 20%, var(--cinnabar) 20% 40%, var(--gardenia) 40% 60%,
      var(--jade) 60% 80%, var(--plum) 80% 100%);
  }
  .backcard .dots{font-family:"Nanum Myeongjo",serif; font-size:30px; letter-spacing:.42em;
    color:var(--cinnabar); animation:pulse 900ms ease-in-out infinite}
  .backcard .msg{font-size:11px; letter-spacing:.34em; color:var(--ink-soft); margin:14px 0 0}
  @keyframes pulse{0%,100%{opacity:.22} 50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){ .backcard .dots{animation:none; opacity:.7} }

  .tune label{display:block; font-size:13.5px; margin-bottom:7px}
  .tune .val{float:right; color:var(--cinnabar); font-weight:700}
  .tune input[type=range]{width:100%; margin:0 0 16px; accent-color:var(--cinnabar)}
  .tune p.note{font-size:12px; color:#A29A8C; margin:0}

  .panel{background:#FFFDF7; border:1px solid var(--line); border-radius:12px; padding:18px}
  .panel + .panel{margin-top:14px}
  .phead{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:12px}
  .phead h2{font-family:"Nanum Myeongjo",serif; font-size:15px; margin:0; letter-spacing:.06em; font-weight:700}
  .link{background:none; border:none; color:var(--ink-soft); font-size:12px; font-family:inherit;
    text-decoration:underline; cursor:pointer; padding:0; white-space:nowrap}
  .link:hover{color:var(--cinnabar)}
  .links{display:flex; gap:14px; margin-top:12px; flex-wrap:wrap}

  .row{display:flex; gap:8px; margin-bottom:10px}
  input[type=text],textarea{
    flex:1; min-width:0; width:100%; font-family:inherit; font-size:15px; padding:11px 12px;
    color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:8px;
  }
  input[type=text]:focus,textarea:focus{border-color:var(--gold); outline:none}
  textarea{resize:vertical}
  input::placeholder,textarea::placeholder{color:#B3AA9A}
  .solid{font-family:inherit; font-weight:700; font-size:14px; padding:10px 16px; cursor:pointer;
    border:1px solid #96291F; border-radius:8px; color:#FBF7EE; background:var(--cinnabar); white-space:nowrap}
  .ghost{font-family:inherit; font-weight:700; font-size:13px; padding:10px 14px; cursor:pointer;
    border:1px solid var(--line); border-radius:8px; color:var(--ink); background:#fff}
  .twin{display:flex; gap:8px; margin-top:8px}
  .twin button{flex:1}
  .warn{font-size:12px; color:var(--cinnabar); margin:0 0 8px; min-height:16px}
  .filter{margin-bottom:8px}

  ul{list-style:none; margin:0; padding:0; max-height:236px; overflow:auto}
  li.item{display:flex; align-items:center; gap:9px; font-size:14px; padding:6px 2px;
    border-bottom:1px solid #EFE8DA}
  li.item .num{font-family:"Nanum Myeongjo",serif; font-size:11px; color:var(--gold);
    width:30px; flex:0 0 auto; text-align:center}
  li.item .txt{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  li.won .num{color:var(--cinnabar)}
  .del{background:none; border:none; color:#B3AA9A; cursor:pointer; font-size:13px; padding:2px 4px}
  .del:hover{color:var(--cinnabar)}
  .none{color:#A29A8C; font-size:13px; padding:8px 2px}

  .opts{border-top:1px solid #EFE8DA; margin-top:14px; padding-top:12px}
  .opts label{display:flex; align-items:center; gap:8px; font-size:13.5px; cursor:pointer; margin-bottom:9px}

  .stagebtn{position:fixed; right:14px; bottom:14px; z-index:9; font-family:inherit;
    font-size:12px; letter-spacing:.1em; padding:10px 16px; border-radius:999px; cursor:pointer;
    color:var(--ink); background:#FFFDF7; border:1px solid var(--line); box-shadow:0 3px 10px rgba(43,39,33,.12)}
  .hide{display:none}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="fairy" viewBox="0 0 160 155" role="img" aria-label="구름을 탄 선녀">
      <!-- 반짝임 -->
      <path d="M18 56 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4z" fill="#C9A227" opacity=".65"/>
      <path d="M141 44 l1.2 3.1 3.1 1.2 -3.1 1.2 -1.2 3.1 -1.2 -3.1 -3.1 -1.2 3.1 -1.2z" fill="#C9A227" opacity=".55"/>
      <path d="M133 96 l1 2.6 2.6 1 -2.6 1 -1 2.6 -1 -2.6 -2.6 -1 2.6 -1z" fill="#C9A227" opacity=".45"/>

      <!-- 천의 -->
      <path d="M39 107 C22 116 11 100 24 90 C30 85 37 88 34 95" fill="none" stroke="#93C6B7" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M121 107 C138 116 149 100 136 90 C130 85 123 88 126 95" fill="none" stroke="#93C6B7" stroke-width="4.4" stroke-linecap="round"/>

      <!-- 치마 -->
      <path d="M63 92 L97 92 L108 132 Q80 140 52 132 Z" fill="#BE3B2E" stroke="#96291F" stroke-width=".9"/>
      <path d="M80 92 L80 136" stroke="#A02E23" stroke-width="1" opacity=".55"/>

      <!-- 저고리 -->
      <path d="M62 76 Q80 69 98 76 L100 93 Q80 99 60 93 Z" fill="#FFFDF7" stroke="#C9A227" stroke-width=".9"/>

      <!-- 색동 소매 -->
      <g fill="none" stroke-linecap="round">
        <path d="M63 79 C52 84 43 94 39 106" stroke="#FFFDF7" stroke-width="15"/>
        <path d="M97 79 C108 84 117 94 121 106" stroke="#FFFDF7" stroke-width="15"/>
        <g stroke-width="12.6">
          <path d="M63 79 C52 84 43 94 39 106" pathLength="50" stroke="#2E5A86" stroke-dasharray="10 40" stroke-dashoffset="0"/>
          <path d="M63 79 C52 84 43 94 39 106" pathLength="50" stroke="#BE3B2E" stroke-dasharray="10 40" stroke-dashoffset="-10"/>
          <path d="M63 79 C52 84 43 94 39 106" pathLength="50" stroke="#DFA93F" stroke-dasharray="10 40" stroke-dashoffset="-20"/>
          <path d="M63 79 C52 84 43 94 39 106" pathLength="50" stroke="#4A8073" stroke-dasharray="10 40" stroke-dashoffset="-30"/>
          <path d="M63 79 C52 84 43 94 39 106" pathLength="50" stroke="#8E4763" stroke-dasharray="10 40" stroke-dashoffset="-40"/>

          <path d="M97 79 C108 84 117 94 121 106" pathLength="50" stroke="#2E5A86" stroke-dasharray="10 40" stroke-dashoffset="0"/>
          <path d="M97 79 C108 84 117 94 121 106" pathLength="50" stroke="#BE3B2E" stroke-dasharray="10 40" stroke-dashoffset="-10"/>
          <path d="M97 79 C108 84 117 94 121 106" pathLength="50" stroke="#DFA93F" stroke-dasharray="10 40" stroke-dashoffset="-20"/>
          <path d="M97 79 C108 84 117 94 121 106" pathLength="50" stroke="#4A8073" stroke-dasharray="10 40" stroke-dashoffset="-30"/>
          <path d="M97 79 C108 84 117 94 121 106" pathLength="50" stroke="#8E4763" stroke-dasharray="10 40" stroke-dashoffset="-40"/>
        </g>
      </g>

      <!-- 옷고름 -->
      <path d="M84 80 C88 88 82 94 85 102" fill="none" stroke="#2E5A86" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="84" cy="80" r="2.8" fill="#2E5A86"/>

      <!-- 손 -->
      <circle cx="39" cy="107" r="5.2" fill="#F7DFC7"/>
      <circle cx="121" cy="107" r="5.2" fill="#F7DFC7"/>

      <!-- 머리 · 얼굴 -->
      <ellipse cx="80" cy="55" rx="20" ry="20" fill="#2B2721"/>
      <circle cx="80" cy="57" r="16.5" fill="#F7DFC7"/>
      <path d="M63.5 55 C63 37 71 31 80 31 C89 31 97 37 96.5 55 C93 45 88 42 80 42 C72 42 67 45 63.5 55 Z" fill="#2B2721"/>
      <ellipse cx="80" cy="27" rx="11.5" ry="8" fill="#2B2721"/>
      <path d="M67 27 L95 27" stroke="#C9A227" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="96.5" cy="27" r="3.2" fill="#C9A227"/>

      <circle cx="68" cy="63" r="3.6" fill="#E4867E" opacity=".7"/>
      <circle cx="92" cy="63" r="3.6" fill="#E4867E" opacity=".7"/>
      <circle cx="80" cy="47" r="2.2" fill="#BE3B2E" opacity=".85"/>
      <g fill="none" stroke="#2B2721" stroke-linecap="round">
        <path d="M70.5 58 Q73.5 54.5 76.5 58" stroke-width="2.2"/>
        <path d="M83.5 58 Q86.5 54.5 89.5 58" stroke-width="2.2"/>
        <path d="M76.5 65 Q80 68.5 83.5 65" stroke-width="2"/>
      </g>

      <!-- 구름 -->
      <path d="M34 146 C20 146 16 132 29 129 C27 117 44 113 52 122 C57 108 80 108 84 121 C92 110 110 114 110 125 C124 124 128 141 114 146 Z"
            fill="#E6EEF3" stroke="#C9A227" stroke-width=".9" stroke-opacity=".55"/>
    </svg>
    <div class="orn"><i></i><span>◈</span><i class="r"></i></div>
    <h1 class="brand">순감타로</h1>
    <p class="tagline">인연의 수레바퀴</p>
  </header>

  <div class="modes">
    <button id="mDraw" class="on">무료타로 추첨</button>
    <button id="mTopic">주제 뽑기</button>
  </div>

  <div class="grid">
    <div class="stage">
      <div class="wheelbox">
        <div class="needle">
          <svg width="30" height="46" viewBox="0 0 30 46" aria-hidden="true">
            <path d="M15 45 C7 32 3 24 3 16 A12 12 0 0 1 27 16 C27 24 23 32 15 45 Z"
                  fill="#BE3B2E" stroke="#8E2A20" stroke-width="1.6"/>
            <circle cx="15" cy="15" r="4.6" fill="#F5EFE2" stroke="#C9A227" stroke-width="1.2"/>
          </svg>
        </div>
        <svg id="wheel" viewBox="0 0 300 300" role="img" aria-label="추첨 돌림판">
          <circle cx="150" cy="150" r="148" fill="#FFFDF7"/>
          <circle cx="150" cy="150" r="147" fill="none" stroke="#C9A227" stroke-width="1"/>
          <circle cx="150" cy="150" r="142.5" fill="none" stroke="#C9A227" stroke-width="2" opacity=".5"/>
          <g id="rotor"></g>
          <!-- 태극 중심 -->
          <circle cx="150" cy="150" r="30" fill="#FFFDF7" stroke="#C9A227" stroke-width="1.6"/>
          <g transform="rotate(-35 150 150)">
            <path d="M150 126 A24 24 0 0 1 150 174 A12 12 0 0 1 150 150 A12 12 0 0 0 150 126 Z" fill="#BE3B2E"/>
            <path d="M150 174 A24 24 0 0 1 150 126 A12 12 0 0 1 150 150 A12 12 0 0 0 150 174 Z" fill="#2E5A86"/>
          </g>
          <circle cx="150" cy="150" r="24" fill="none" stroke="#C9A227" stroke-width=".8" opacity=".7"/>
        </svg>
        <p class="empty hide" id="empty"></p>
      </div>

      <button id="spin">돌 리 기</button>
      <p class="tally" id="tally"></p>
      <p class="hintkey" id="hintkey">스페이스바로도 돌릴 수 있습니다</p>
      <div class="result" id="result"></div>
    </div>

    <aside>
      <!-- 참가자 -->
      <div class="panel" id="drawPanel">
        <div class="phead">
          <h2>참가자 <span id="pCount">0</span>명</h2>
          <button class="link" id="bulkToggle">여러 줄 붙여넣기</button>
        </div>

        <div id="drawEdit">
          <div class="row">
            <input type="text" id="draft" placeholder="닉네임 입력" autocomplete="off">
            <button class="solid" id="add">추가</button>
          </div>
          <p class="warn" id="warn"></p>
          <input type="text" id="filter" class="filter hide" placeholder="명단에서 찾기" autocomplete="off">
          <ul id="list"></ul>
          <div class="links">
            <button class="link" id="copyP">명단 복사</button>
            <button class="link" id="clearP">참가자 비우기</button>
          </div>
        </div>

        <div id="bulkView" class="hide">
          <textarea id="bulk" rows="7" placeholder="한 줄에 하나씩&#10;채팅 닉네임 붙여넣기"></textarea>
          <div class="twin">
            <button class="ghost" id="bulkAppend">기존에 추가</button>
            <button class="solid" id="bulkReplace">전체 교체</button>
          </div>
        </div>

        <div class="opts">
          <label><input type="checkbox" id="optRemove" checked> 당첨자는 명단에서 빼기</label>
          <label><input type="checkbox" id="optSkipWon" checked> 붙여넣을 때 기존 당첨자 제외</label>
          <label><input type="checkbox" id="optSound" checked> 소리 켜기</label>
        </div>
      </div>

      <!-- 주제 -->
      <div class="panel hide" id="topicPanel">
        <div class="phead">
          <h2>주제 <span id="tCount">0</span>개</h2>
          <button class="link" id="resetTopic">기본 주제로</button>
        </div>
        <div class="row">
          <input type="text" id="tDraft" placeholder="주제 추가" autocomplete="off">
          <button class="solid" id="tAdd">추가</button>
        </div>
        <ul id="tList"></ul>
      </div>

      <!-- 연출 -->
      <div class="panel tune">
        <div class="phead"><h2>연출</h2></div>
        <label for="rSpin">돌아가는 시간 <span class="val" id="vSpin">6.0초</span></label>
        <input type="range" id="rSpin" min="3" max="20" step="0.5" value="6">
        <label for="rDelay">결과 뜸 들이기 <span class="val" id="vDelay">1.5초</span></label>
        <input type="range" id="rDelay" min="0" max="8" step="0.5" value="1.5">
        <p class="note">멈춘 뒤 이만큼 있다가 당첨자가 공개됩니다.</p>
      </div>

      <!-- 당첨자 -->
      <div class="panel hide" id="wonPanel">
        <div class="phead">
          <h2>당첨자 <span id="wCount">0</span>명</h2>
          <button class="link" id="copyWon">복사</button>
        </div>
        <ul id="wonList" style="max-height:200px"></ul>
        <div class="links">
          <button class="link hide" id="undo">마지막 당첨 취소</button>
          <button class="link" id="clearW">당첨자 초기화</button>
        </div>
      </div>
    </aside>
  </div>
</div>

<button class="stagebtn" id="stageBtn">방송 모드</button>

<script>
(function(){
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var TONES = [
    {f:"#BE3B2E", t:"#FDF8EE"},
    {f:"#2E5A86", t:"#FDF8EE"},
    {f:"#DFA93F", t:"#2B2721"},
    {f:"#4A8073", t:"#FDF8EE"},
    {f:"#8E4763", t:"#FDF8EE"}
  ];
  var GOLD = "#C9A227";
  var DEFAULT_TOPICS = ["연애운","재회","궁합","짝사랑","금전운","직장운","이직","진로","시험운","인간관계","가족","이사","오늘의 운세","이달의 운세"];
  var KEY = "sungam.v1";

  var mode = "draw";
  var people = [], topics = DEFAULT_TOPICS.slice(), winners = [];
  var lastWin = null;
  var rotation = 0, spinning = false, audio = null;

  var $ = function(id){ return document.getElementById(id); };
  var rotor = $("rotor"), spinBtn = $("spin"), resultBox = $("result");

  function items(){ return mode === "draw" ? people : topics; }

  /* ── 한자 숫자 ── */
  var D = ["","一","二","三","四","五","六","七","八","九"];
  function hanja(n){
    if (n < 10) return D[n];
    if (n < 20) return "十" + D[n-10];
    if (n < 100){
      var t = Math.floor(n/10), o = n%10;
      return D[t] + "十" + (o ? D[o] : "");
    }
    return String(n);
  }

  /* ── 저장 ── */
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        people:people, topics:topics, winners:winners,
        o:{ rm:$("optRemove").checked, sk:$("optSkipWon").checked, sd:$("optSound").checked,
            sp:$("rSpin").value, dl:$("rDelay").value }
      }));
    }catch(e){}
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (Array.isArray(d.people))  people  = d.people;
      if (Array.isArray(d.topics) && d.topics.length) topics = d.topics;
      if (Array.isArray(d.winners)) winners = d.winners;
      if (d.o){
        $("optRemove").checked  = d.o.rm !== false;
        $("optSkipWon").checked = d.o.sk !== false;
        $("optSound").checked   = d.o.sd !== false;
        if (d.o.sp) $("rSpin").value  = d.o.sp;
        if (d.o.dl !== undefined && d.o.dl !== null) $("rDelay").value = d.o.dl;
      }
    }catch(e){}
  }

  /* ── 소리 ── */
  function ac(){
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    if (!audio) audio = new C();
    if (audio.state === "suspended") audio.resume();
    return audio;
  }
  function blip(f,d,v,type){
    if (!$("optSound").checked) return;
    try{
      var a = ac(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "triangle";
      o.frequency.setValueAtTime(f, a.currentTime);
      g.gain.setValueAtTime(v, a.currentTime);
      g.gain.exponentialRampToValueAtTime(.0008, a.currentTime + d);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + d + .02);
    }catch(e){}
  }
  function tick(){ blip(1240,.035,.03,"square"); }
  function thump(){ blip(138,.34,.075,"sine"); }
  function bell(){
    blip(1046.5,1.1,.075);
    setTimeout(function(){ blip(1318.5,1.3,.06); }, 130);
    setTimeout(function(){ blip(1568,1.5,.045); }, 270);
  }

  /* ── 휠 ── */
  function drawWheel(){
    while (rotor.firstChild) rotor.removeChild(rotor.firstChild);
    var arr = items(), n = arr.length, em = $("empty");

    if (n < 2){
      em.className = "empty";
      em.textContent = mode === "draw" ? "참가자를 두 분 이상 넣어주세요" : "주제를 두 개 이상 넣어주세요";
    } else em.className = "empty hide";

    spinBtn.disabled = spinning || n < 2;

    if (mode === "draw" && n > 0){
      $("tally").textContent = n + "명 참여 · 당첨 확률 " + (100/n).toFixed(1) + "%";
    } else $("tally").textContent = "";

    if (n < 2){
      var c = document.createElementNS(NS,"circle");
      c.setAttribute("cx",150); c.setAttribute("cy",150); c.setAttribute("r",138);
      c.setAttribute("fill","#EFE8DA");
      rotor.appendChild(c);
      return;
    }

    var seg = 360/n, R = 138, dense = n > 24;
    var maxCh = n<=7?8:n<=12?7:n<=18?6:5;
    var fs    = n<=7?14:n<=12?12:n<=18?10:8.5;

    for (var i=0;i<n;i++){
      var a0 = (i*seg-90)*Math.PI/180, a1 = ((i+1)*seg-90)*Math.PI/180;
      var x0 = 150+R*Math.cos(a0), y0 = 150+R*Math.sin(a0);
      var x1 = 150+R*Math.cos(a1), y1 = 150+R*Math.sin(a1);
      var col = TONES[i % TONES.length];
      if (n % TONES.length === 1 && i === n-1) col = TONES[(i+1) % TONES.length];

      var p = document.createElementNS(NS,"path");
      p.setAttribute("d","M 150 150 L "+x0+" "+y0+" A "+R+" "+R+" 0 "+(seg>180?1:0)+" 1 "+x1+" "+y1+" Z");
      p.setAttribute("fill",col.f);
      p.setAttribute("stroke","#FFFDF7"); p.setAttribute("stroke-width",".9");
      rotor.appendChild(p);

      var g = document.createElementNS(NS,"g");
      g.setAttribute("transform","rotate("+(i*seg+seg/2-90)+" 150 150)");

      var t = document.createElementNS(NS,"text");
      t.setAttribute("text-anchor","end"); t.setAttribute("dominant-baseline","middle");
      t.setAttribute("y",150.5); t.setAttribute("font-family","Gowun Batang, serif");
      if (dense){
        t.setAttribute("x",228); t.setAttribute("font-size","7.5");
        t.setAttribute("fill",col.t); t.textContent = (i+1);
      } else {
        t.setAttribute("x",232); t.setAttribute("font-size",fs); t.setAttribute("font-weight","700");
        t.setAttribute("fill",col.t);
        t.textContent = arr[i].length > maxCh ? arr[i].slice(0,maxCh)+"…" : arr[i];
      }
      g.appendChild(t);

      if (!dense){
        var r = document.createElementNS(NS,"text");
        r.setAttribute("x",194); r.setAttribute("y",150.5);
        r.setAttribute("text-anchor","middle"); r.setAttribute("dominant-baseline","middle");
        r.setAttribute("fill",col.t); r.setAttribute("font-size","6.5");
        r.setAttribute("font-family","Nanum Myeongjo, serif"); r.setAttribute("opacity",".62");
        r.textContent = hanja(i+1);
        g.appendChild(r);
      }
      rotor.appendChild(g);
    }

    var ring = document.createElementNS(NS,"circle");
    ring.setAttribute("cx",150); ring.setAttribute("cy",150); ring.setAttribute("r",116);
    ring.setAttribute("fill","none"); ring.setAttribute("stroke","#FFFDF7");
    ring.setAttribute("stroke-width",".8"); ring.setAttribute("opacity",".45");
    rotor.appendChild(ring);
  }

  /* ── 목록 ── */
  function fillList(ul, arr, remove, won, q){
    ul.innerHTML = "";
    var shown = arr.map(function(v,i){ return {v:v, i:i}; });
    if (q) shown = shown.filter(function(x){ return x.v.toLowerCase().indexOf(q) > -1; });

    if (!shown.length){
      var li = document.createElement("li");
      li.className = "none";
      li.textContent = q ? "찾는 이름이 없습니다" : "비어 있습니다";
      ul.appendChild(li); return;
    }
    shown.forEach(function(x){
      var li = document.createElement("li");
      li.className = won ? "item won" : "item";
      var nu = document.createElement("span"); nu.className = "num";
      nu.textContent = won ? hanja(arr.length - x.i) : hanja(x.i + 1);
      var tx = document.createElement("span"); tx.className = "txt"; tx.textContent = x.v;
      li.appendChild(nu); li.appendChild(tx);
      if (remove){
        var b = document.createElement("button");
        b.className = "del"; b.textContent = "✕";
        b.setAttribute("aria-label", x.v + " 삭제");
        b.onclick = function(){ remove(x.i); };
        li.appendChild(b);
      }
      ul.appendChild(li);
    });
  }

  function render(){
    drawWheel();
    $("pCount").textContent = people.length;
    $("tCount").textContent = topics.length;
    $("wCount").textContent = winners.length;
    $("filter").className = people.length > 12 ? "filter" : "filter hide";

    fillList($("list"), people,
      function(i){ people.splice(i,1); render(); }, false,
      $("filter").value.trim().toLowerCase());
    fillList($("tList"), topics,
      function(i){ topics.splice(i,1); render(); }, false, "");
    fillList($("wonList"), winners,
      function(i){ winners.splice(i,1); if(!winners.length) lastWin=null; render(); }, true, "");

    $("wonPanel").className = winners.length ? "panel" : "panel hide";
    $("undo").className = lastWin ? "link" : "link hide";
    $("hintkey").className = spinning ? "hintkey hide" : "hintkey";
    rotor.style.transform = "rotate(" + rotation + "deg)";
    save();
  }

  /* ── 스핀 ── */
  var waitTimer = null, waitBeat = null;

  function showBack(){
    resultBox.innerHTML = "";
    var b = document.createElement("div"); b.className = "backcard";
    var d = document.createElement("p"); d.className = "dots"; d.textContent = "···";
    var m = document.createElement("p"); m.className = "msg";
    m.textContent = mode === "draw" ? "인 연 을 헤 아 리 는 중" : "뜻 을 살 피 는 중";
    b.appendChild(d); b.appendChild(m);
    resultBox.appendChild(b);
  }

  function settle(finalRot, snap){
    var size = 360/snap.length;
    var pointed = ((360 - (finalRot % 360)) % 360);
    var idx = Math.floor(pointed/size) % snap.length;
    var name = snap[idx];

    var wait = parseFloat($("rDelay").value) * 1000;
    if (wait > 0){
      showBack();
      thump();
      waitBeat = setInterval(thump, 620);
      waitTimer = setTimeout(function(){
        clearInterval(waitBeat); waitBeat = null; waitTimer = null;
        reveal(name);
      }, wait);
    } else reveal(name);
  }

  function reveal(name){
    spinning = false;
    spinBtn.textContent = "돌 리 기";

    if (mode === "draw"){
      winners.unshift(name);
      var removed = false;
      if ($("optRemove").checked){
        var k = people.indexOf(name);
        if (k > -1){ people.splice(k,1); removed = true; }
      }
      lastWin = { name:name, removed:removed };
    }

    resultBox.innerHTML = "";
    var card = document.createElement("div"); card.className = "card";
    var eye = document.createElement("p"); eye.className = "eye";
    eye.textContent = mode === "draw" ? "무 료 타 로 당 첨" : "오 늘 의 주 제";
    var nm = document.createElement("p"); nm.className = "name"; nm.textContent = name;
    var ft = document.createElement("p"); ft.className = "foot";
    ft.textContent = mode === "draw" ? hanja(winners.length) + "번째 · 순감타로" : "순감타로";
    card.appendChild(eye); card.appendChild(nm); card.appendChild(ft);
    resultBox.appendChild(card);
    bell();
    render();
  }

  function spin(){
    var arr = items();
    if (spinning || arr.length < 2) return;
    spinning = true; spinBtn.disabled = true; spinBtn.textContent = "···";
    resultBox.innerHTML = "";
    $("hintkey").className = "hintkey hide";

    var snap = arr.slice(), seg = 360/snap.length;
    var dur = parseFloat($("rSpin").value) * 1000;
    var turns = 4 + dur/1600 + Math.random()*2;
    var target = rotation + turns*360 + Math.random()*360;

    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      rotation = target;
      rotor.style.transform = "rotate(" + rotation + "deg)";
      settle(target, snap); return;
    }
    var start = rotation, delta = target - start, t0 = performance.now();
    var last = Math.floor(start/seg);
    function frame(now){
      var p = Math.min(1,(now - t0)/dur);
      rotation = start + delta * (1 - Math.pow(1-p, 5));
      rotor.style.transform = "rotate(" + rotation + "deg)";
      var k = Math.floor(rotation/seg);
      if (k !== last){ last = k; tick(); }
      if (p < 1) requestAnimationFrame(frame); else settle(target, snap);
    }
    requestAnimationFrame(frame);
  }

  /* ── 참가자 ── */
  function norm(s){ return s.replace(/^@+/,"").replace(/\s+/g," ").trim(); }
  function has(arr, v){
    var lv = v.toLowerCase();
    return arr.some(function(x){ return x.toLowerCase() === lv; });
  }
  function addPerson(){
    var v = norm($("draft").value), w = $("warn");
    if (!v){ w.textContent = ""; return; }
    if (has(people, v)){ w.textContent = "이미 참여 중인 닉네임입니다"; return; }
    people.push(v);
    $("draft").value = "";
    w.textContent = has(winners, v) ? v + " 님은 이전에 당첨된 적이 있습니다" : "";
    render();
  }
  function parseBulk(){
    var seen = {}, out = [], skip = $("optSkipWon").checked;
    $("bulk").value.split("\n").forEach(function(s){
      var v = norm(s);
      if (!v) return;
      var k = v.toLowerCase();
      if (seen[k]) return;
      if (skip && has(winners, v)) return;
      seen[k] = 1; out.push(v);
    });
    return out;
  }
  function closeBulk(){
    $("bulkView").className = "hide";
    $("drawEdit").className = "";
    $("bulkToggle").textContent = "여러 줄 붙여넣기";
    $("bulk").value = "";
  }
  function copyText(txt, btn, label){
    function done(){
      btn.textContent = "복사됨";
      setTimeout(function(){ btn.textContent = label; }, 1500);
    }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }catch(e){}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, fallback);
    } else fallback();
  }

  $("add").onclick = addPerson;
  $("draft").onkeydown = function(e){ if (e.key === "Enter") addPerson(); };
  $("filter").oninput = render;
  $("clearP").onclick = function(){
    if (people.length && !confirm("참가자 명단을 모두 비울까요?")) return;
    people = []; $("warn").textContent = ""; $("filter").value = ""; render();
  };
  $("copyP").onclick = function(){
    copyText(people.map(function(n,i){ return (i+1)+". "+n; }).join("\n"), this, "명단 복사");
  };

  $("bulkToggle").onclick = function(){
    var open = $("bulkView").className.indexOf("hide") === -1;
    if (open){ closeBulk(); return; }
    $("bulkView").className = "";
    $("drawEdit").className = "hide";
    this.textContent = "취소";
  };
  $("bulkAppend").onclick = function(){
    parseBulk().forEach(function(v){ if (!has(people, v)) people.push(v); });
    closeBulk(); resultBox.innerHTML = ""; render();
  };
  $("bulkReplace").onclick = function(){
    var out = parseBulk();
    if (out.length) people = out;
    closeBulk(); resultBox.innerHTML = ""; render();
  };

  /* ── 당첨자 ── */
  $("copyWon").onclick = function(){
    var txt = winners.slice().reverse().map(function(n,i){ return (i+1)+". "+n; }).join("\n");
    copyText(txt, this, "복사");
  };
  $("clearW").onclick = function(){
    if (winners.length && !confirm("당첨자 기록을 모두 지울까요?")) return;
    winners = []; lastWin = null; render();
  };
  $("undo").onclick = function(){
    if (!lastWin) return;
    var k = winners.indexOf(lastWin.name);
    if (k > -1) winners.splice(k,1);
    if (lastWin.removed && !has(people, lastWin.name)) people.push(lastWin.name);
    lastWin = null; resultBox.innerHTML = ""; render();
  };

  /* ── 주제 ── */
  $("tAdd").onclick = function(){
    var v = $("tDraft").value.trim();
    if (!v || has(topics, v)) { $("tDraft").value = ""; return; }
    topics.push(v); $("tDraft").value = ""; render();
  };
  $("tDraft").onkeydown = function(e){ if (e.key === "Enter") $("tAdd").click(); };
  $("resetTopic").onclick = function(){ topics = DEFAULT_TOPICS.slice(); resultBox.innerHTML = ""; render(); };

  /* ── 모드 ── */
  function cancelWait(){
    if (waitTimer){ clearTimeout(waitTimer); waitTimer = null; }
    if (waitBeat){ clearInterval(waitBeat); waitBeat = null; }
    if (spinning){ spinning = false; spinBtn.textContent = "돌 리 기"; }
  }

  function setMode(m){
    cancelWait();
    mode = m;
    $("mDraw").className  = m === "draw"  ? "on" : "";
    $("mTopic").className = m === "topic" ? "on" : "";
    $("drawPanel").className  = m === "draw"  ? "panel" : "panel hide";
    $("topicPanel").className = m === "topic" ? "panel" : "panel hide";
    resultBox.innerHTML = "";
    render();
  }
  $("mDraw").onclick  = function(){ setMode("draw"); };
  $("mTopic").onclick = function(){ setMode("topic"); };

  spinBtn.onclick = spin;
  $("wheel").onclick = function(){ if (document.body.classList.contains("stage-mode")) spin(); };
  $("stageBtn").onclick = function(){
    document.body.classList.toggle("stage-mode");
    var on = document.body.classList.contains("stage-mode");
    this.textContent = on ? "설정 열기" : "방송 모드";
  };
  document.addEventListener("keydown", function(e){
    if (e.code !== "Space" && e.key !== " ") return;
    var t = e.target.tagName;
    if (t === "INPUT" || t === "TEXTAREA" || t === "BUTTON") return;
    e.preventDefault(); spin();
  });
  ["optRemove","optSkipWon","optSound"].forEach(function(id){
    $(id).onchange = save;
  });

  function syncTune(){
    $("vSpin").textContent  = parseFloat($("rSpin").value).toFixed(1) + "초";
    var d = parseFloat($("rDelay").value);
    $("vDelay").textContent = d === 0 ? "없음" : d.toFixed(1) + "초";
  }
  $("rSpin").oninput  = function(){ syncTune(); save(); };
  $("rDelay").oninput = function(){ syncTune(); save(); };

  load();
  syncTune();
  setMode("draw");
})();
</script>
</body>
</html>
