<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>순감타로 · 인연의 수레바퀴</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&display=swap');

  :root{
    --hanji:#F5EFE2; --ink:#2B2721; --ink-soft:#6E675C;
    --cinnabar:#BE3B2E; --indigo:#2E5A86; --jade:#4A8073;
    --gardenia:#DFA93F; --plum:#8E4763; --gold:#C9A227; --line:#E0D6C2;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    background:
      radial-gradient(900px 520px at 50% -8%, #FBF7EC 0%, transparent 70%),
      radial-gradient(600px 400px at 88% 105%, #F0E6D2 0%, transparent 70%),
      var(--hanji);
    font-family:"Gowun Batang","Apple SD Gothic Neo","Malgun Gothic",serif;
  }
  body::before{
    content:""; position:fixed; top:0; left:0; right:0; height:5px; z-index:20;
    background:linear-gradient(90deg,
      var(--indigo) 0 20%, var(--cinnabar) 20% 40%, var(--gardenia) 40% 60%,
      var(--jade) 60% 80%, var(--plum) 80% 100%);
  }
  .wrap{max-width:1060px; margin:0 auto; padding:34px 18px 64px}

  header{text-align:center; margin-bottom:16px}
  .fairy{width:min(148px,40vw); height:auto; display:block; margin:0 auto -2px;
    animation:float 5s ease-in-out infinite; filter:drop-shadow(0 6px 10px rgba(43,39,33,.10))}
  @keyframes float{0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)}}
  @media(prefers-reduced-motion:reduce){ .fairy{animation:none} }
  .orn{display:flex; align-items:center; justify-content:center; gap:12px; color:var(--gold)}
  .orn i{display:block; height:1px; width:min(140px,20vw); background:linear-gradient(90deg,transparent,var(--gold))}
  .orn i.r{background:linear-gradient(270deg,transparent,var(--gold))}
  .orn span{color:var(--cinnabar); font-size:11px}
  .brand{font-family:"Nanum Myeongjo",serif; font-weight:800;
    font-size:clamp(34px,7vw,52px); letter-spacing:.1em; margin:10px 0 4px}
  .tagline{font-size:12px; letter-spacing:.34em; color:var(--ink-soft); margin:0}

  .modes{display:flex; margin:22px auto 28px; max-width:440px;
    border:1px solid var(--line); border-radius:999px; overflow:hidden; background:#fff}
  .modes button{flex:1; font-family:inherit; font-size:13.5px; padding:11px 6px; cursor:pointer;
    background:transparent; border:none; color:var(--ink-soft)}
  .modes button.on{background:var(--cinnabar); color:#FBF7EE; font-weight:700}

  .grid{display:grid; grid-template-columns:1fr; gap:32px; align-items:start}
  @media(min-width:940px){ .grid{grid-template-columns:1fr 330px} }
  body.stage-mode .grid{grid-template-columns:1fr}
  body.stage-mode aside, body.stage-mode .modes{display:none}

  .stage{display:flex; flex-direction:column; align-items:center; width:100%}
  #wheelStage, #timerStage{width:100%; display:flex; flex-direction:column; align-items:center}
  /* id 선택자가 .hide 보다 우선하므로 함께 명시해야 실제로 감춰진다 */
  #wheelStage.hide, #timerStage.hide{display:none}
  .wheelbox{position:relative; width:100%; max-width:430px; transition:max-width .45s ease}
  body.stage-mode .wheelbox{max-width:min(560px,70vh)}
  .needle{position:absolute; top:-12px; left:50%; transform:translateX(-50%); z-index:3;
    filter:drop-shadow(0 3px 5px rgba(43,39,33,.28))}
  #wheel{width:100%; display:block; filter:drop-shadow(0 14px 30px rgba(43,39,33,.16))}
  #rotor{transform-origin:150px 150px}
  .empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:14px; text-align:center; padding:0 76px; line-height:1.7}

  #spin{margin-top:24px; padding:15px 52px; font-family:"Nanum Myeongjo",serif; font-weight:800;
    font-size:21px; letter-spacing:.16em; cursor:pointer; border-radius:999px; color:#FBF7EE;
    background:linear-gradient(180deg,#CC4636,#A93024); border:1px solid #96291F; box-shadow:0 5px 0 #7E2119}
  #spin:active{transform:translateY(3px); box-shadow:0 2px 0 #7E2119}
  #spin:disabled{background:#D8D0C0; border-color:#C7BEAA; color:#8C857A; box-shadow:none; cursor:not-allowed; transform:none}
  .tally{margin-top:14px; font-size:12.5px; color:var(--ink-soft); min-height:18px}

  .result{min-height:196px; margin-top:20px; display:flex; align-items:center; justify-content:center;
    perspective:900px; width:100%}
  .card{position:relative; width:min(340px,88vw); padding:26px 22px 18px; text-align:center;
    background:#FFFDF7; border:1px solid var(--cinnabar); border-radius:6px; overflow:hidden;
    box-shadow:0 0 0 4px #FFFDF7, 0 0 0 5px rgba(201,162,39,.55), 0 16px 34px rgba(43,39,33,.18);
    animation:rise 620ms cubic-bezier(.2,.9,.25,1) both}
  .card::before, .backcard::before{content:""; position:absolute; top:0; left:0; right:0; height:5px;
    background:linear-gradient(90deg,
      var(--indigo) 0 20%, var(--cinnabar) 20% 40%, var(--gardenia) 40% 60%,
      var(--jade) 60% 80%, var(--plum) 80% 100%)}
  .card .eye{font-size:11px; letter-spacing:.4em; color:var(--cinnabar); margin:6px 0 12px}
  .card .name{font-family:"Nanum Myeongjo",serif; font-weight:800;
    font-size:clamp(24px,5.4vw,32px); line-height:1.35; margin:0; word-break:break-all}
  .card .foot{font-size:11px; letter-spacing:.2em; color:var(--ink-soft); margin:14px 0 0}
  @keyframes rise{from{transform:rotateX(-84deg) translateY(24px); opacity:0}
                  to{transform:rotateX(0) translateY(0); opacity:1}}
  @media(prefers-reduced-motion:reduce){ .card{animation:none} }
  .backcard{position:relative; width:min(340px,88vw); padding:40px 22px 34px; text-align:center;
    background:#FFFDF7; border:1px solid var(--line); border-radius:6px; overflow:hidden;
    box-shadow:0 0 0 4px #FFFDF7, 0 0 0 5px rgba(201,162,39,.35), 0 16px 34px rgba(43,39,33,.14)}
  .backcard .dots{font-family:"Nanum Myeongjo",serif; font-size:30px; letter-spacing:.42em;
    color:var(--cinnabar); animation:pulse 900ms ease-in-out infinite}
  .backcard .msg{font-size:11px; letter-spacing:.34em; color:var(--ink-soft); margin:14px 0 0}
  @keyframes pulse{0%,100%{opacity:.22} 50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){ .backcard .dots{animation:none; opacity:.7} }

  .after{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:14px; min-height:1px}

  /* 타이머 */
  .timerbox{position:relative; width:100%; max-width:400px}
  #ring{width:100%; display:block}
  .tface{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center}
  .tface .who{font-size:13px; letter-spacing:.16em; color:var(--ink-soft); margin:0 0 6px;
    max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tface .clock{font-family:"Nanum Myeongjo",serif; font-weight:800;
    font-size:clamp(46px,13vw,68px); line-height:1; margin:0; letter-spacing:.02em}
  .tface .state{font-size:11px; letter-spacing:.3em; color:var(--gold); margin:10px 0 0; min-height:14px}
  .tctrl{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:22px}
  .presets{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:14px}

  .panel{background:#FFFDF7; border:1px solid var(--line); border-radius:12px; padding:18px}
  .panel + .panel{margin-top:14px}
  .phead{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:12px}
  .phead h2{font-family:"Nanum Myeongjo",serif; font-size:15px; margin:0; letter-spacing:.06em; font-weight:700}
  .link{background:none; border:none; color:var(--ink-soft); font-size:12px; font-family:inherit;
    text-decoration:underline; cursor:pointer; padding:0; white-space:nowrap}
  .link:hover{color:var(--cinnabar)}
  .link.arm{color:#FBF7EE; font-weight:700; text-decoration:none;
    background:var(--cinnabar); padding:4px 11px; border-radius:999px}
  .solid.arm{background:#8E2A20; border-color:#7A2119}
  .ghost.arm{border-color:var(--cinnabar); color:var(--cinnabar); font-weight:700}
  .links{display:flex; gap:14px; margin-top:12px; flex-wrap:wrap}

  .row{display:flex; gap:8px; margin-bottom:10px}
  input[type=text],input[type=number],textarea{
    flex:1; min-width:0; width:100%; font-family:inherit; font-size:15px; padding:11px 12px;
    color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:8px}
  input:focus,textarea:focus{border-color:var(--gold); outline:none}
  textarea{resize:vertical}
  input::placeholder,textarea::placeholder{color:#B3AA9A}
  .solid{font-family:inherit; font-weight:700; font-size:14px; padding:10px 16px; cursor:pointer;
    border:1px solid #96291F; border-radius:8px; color:#FBF7EE; background:var(--cinnabar); white-space:nowrap}
  .ghost{font-family:inherit; font-weight:700; font-size:13.5px; padding:10px 15px; cursor:pointer;
    border:1px solid var(--line); border-radius:8px; color:var(--ink); background:#fff; white-space:nowrap}
  .ghost.on{border-color:var(--cinnabar); color:var(--cinnabar)}
  .chip{font-family:inherit; font-size:12.5px; padding:7px 13px; border-radius:999px; cursor:pointer;
    background:#fff; color:var(--ink); border:1px solid var(--line)}
  .chip.on{border-color:var(--cinnabar); color:var(--cinnabar); font-weight:700}
  .twin{display:flex; gap:8px; margin-top:8px}
  .twin button{flex:1}
  .warn{font-size:12px; color:var(--cinnabar); margin:0 0 8px; min-height:16px}

  ul{list-style:none; margin:0; padding:0}
  li.item{display:flex; align-items:center; gap:8px; font-size:14px; padding:6px 2px;
    border-bottom:1px solid #EFE8DA}
  li.item .num{font-family:"Nanum Myeongjo",serif; font-size:11px; color:var(--gold);
    width:28px; flex:0 0 auto; text-align:center}
  li.item .txt{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  li.item .sub{font-size:11.5px; color:var(--jade); margin-left:6px}
  li.done .txt{color:#A29A8C; text-decoration:line-through}
  li.cur{background:#FBF3E4; border-radius:6px}
  .wbtn{font-family:"Nanum Myeongjo",serif; font-size:11.5px; font-weight:700; padding:3px 7px;
    border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer}
  .wbtn.up{border-color:var(--cinnabar); color:var(--cinnabar)}
  .del{background:none; border:none; color:#B3AA9A; cursor:pointer; font-size:13px; padding:2px 4px}
  .del:hover{color:var(--cinnabar)}
  .mini{background:none; border:1px solid var(--line); border-radius:6px; color:var(--ink-soft);
    font-family:inherit; font-size:11.5px; padding:3px 8px; cursor:pointer}
  .mini:hover{border-color:var(--cinnabar); color:var(--cinnabar)}
  .none{color:#A29A8C; font-size:13px; padding:8px 2px}
  .grip{flex:0 0 auto; width:22px; text-align:center; cursor:grab; color:#C3B9A6;
    font-size:13px; line-height:1; touch-action:none; user-select:none; -webkit-user-select:none}
  .grip:active{cursor:grabbing; color:var(--cinnabar)}
  li.dragging{opacity:.65; background:#F7EFDF; border-radius:6px}
  .sess{font-size:13px; border-bottom:1px solid #EFE8DA; padding:8px 2px;
    display:flex; align-items:center; gap:8px}
  .sess .d{font-family:"Nanum Myeongjo",serif; flex:1}
  .sess .c{color:var(--ink-soft); font-size:12px}

  .opts{border-top:1px solid #EFE8DA; margin-top:14px; padding-top:12px}
  .opts label{display:flex; align-items:center; gap:8px; font-size:13.5px; cursor:pointer; margin-bottom:9px}
  .tune label{display:block; font-size:13.5px; margin-bottom:7px}
  .tune .val{float:right; color:var(--cinnabar); font-weight:700}
  .tune input[type=range]{width:100%; margin:0 0 16px; accent-color:var(--cinnabar)}
  .tune p.note{font-size:12px; color:#A29A8C; margin:0}

  .stagebtn{position:fixed; right:14px; bottom:14px; z-index:9; font-family:inherit;
    font-size:12px; letter-spacing:.1em; padding:10px 16px; border-radius:999px; cursor:pointer;
    color:var(--ink); background:#FFFDF7; border:1px solid var(--line); box-shadow:0 3px 10px rgba(43,39,33,.12)}
  .ver{text-align:center; font-size:10px; letter-spacing:.2em; color:#BDB4A4; margin:34px 0 0}
  .hide{display:none}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px}

  @media(max-width:620px){
    .wrap{padding:16px 13px 40px}
    header{margin-bottom:8px}
    .fairy{width:min(108px,30vw); margin-bottom:-4px}
    .brand{font-size:clamp(27px,8vw,36px); margin:4px 0 2px; letter-spacing:.08em}
    .tagline{font-size:10.5px; letter-spacing:.26em}
    .orn i{width:min(84px,17vw)}
    .modes{margin:12px auto 14px}
    .modes button{padding:9px 4px; font-size:12px}
    .grid{gap:20px}
    .wheelbox{max-width:min(360px,78vw)}
    body.revealed .wheelbox{max-width:min(248px,56vw)}
    #spin{margin-top:15px; padding:12px 38px; font-size:19px}
    .tally{margin-top:8px; font-size:11.5px}
    .result{min-height:0; margin-top:13px}
    .card{padding:19px 18px 13px}
    .card .eye{font-size:10px; letter-spacing:.28em; margin:3px 0 8px}
    .card .foot{margin-top:9px}
    .backcard{padding:24px 18px 20px}
    .timerbox{max-width:min(330px,74vw)}
    .stagebtn{right:10px; bottom:10px; padding:8px 13px; font-size:11px}
  }
</style>
</head>

<script>
(function(){
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var TONES = [
    {f:"#BE3B2E", t:"#FDF8EE"}, {f:"#2E5A86", t:"#FDF8EE"},
    {f:"#DFA93F", t:"#2B2721"}, {f:"#4A8073", t:"#FDF8EE"},
    {f:"#8E4763", t:"#FDF8EE"}
  ];
  var GOLD = "#C9A227";
  var DEFAULT_TOPICS = ["연애운","재회","궁합","짝사랑","금전운","직장운","이직","진로","시험운","인간관계","가족","이사","오늘의 운세","이달의 운세"];
  var DEFAULT_BONUS  = ["무료 질문 1개","꽝","복채 면제","추가 질문 1개","심층 3분","한 번 더"];
  var TPRESETS = [1,3,5,10];
  var KEY = "sungam.v2", OLDKEY = "sungam.v1";

  var mode = "draw";
  var people = [];                 /* {n, w} */
  var topics = DEFAULT_TOPICS.slice();
  var bonuses = DEFAULT_BONUS.slice();
  var queue = [];                  /* {n, benefit, done} */
  var bonusFor = null;             /* 혜택 룰렛 대상자 이름 */
  var sessions = [];               /* 지난 방송 기록 */
  var lastWin = null;
  var rotation = 0, spinning = false, audio = null;
  var waitTimer = null, waitBeat = null, spinStartedAt = 0;

  /* 타이머 상태 */
  var tTotal = 180, tLeft = 180, tRunning = false, tEndAt = 0, tTick = null, tName = "", tWarned = false;

  var $ = function(id){ return document.getElementById(id); };
  var rotor = $("rotor"), spinBtn = $("spin"), resultBox = $("result"), afterBox = $("after");

  function setRot(){
    var v = rotation.toFixed(2);
    rotor.setAttribute("transform", "rotate(" + v + " 150 150)");
    try{ rotor.style.transform = "rotate(" + v + "deg)"; }catch(e){}
  }
  function nowMs(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }
  function raf(cb){
    if (window.requestAnimationFrame) return window.requestAnimationFrame(cb);
    if (window.webkitRequestAnimationFrame) return window.webkitRequestAnimationFrame(cb);
    return setTimeout(cb, 16);
  }

  /* ── 한자 숫자 ── */
  var D = ["","一","二","三","四","五","六","七","八","九"];
  function hanja(n){
    if (n < 10) return D[n];
    if (n < 20) return "十" + D[n-10];
    if (n < 100){ var t = Math.floor(n/10), o = n%10; return D[t] + "十" + (o ? D[o] : ""); }
    return String(n);
  }
  function mmss(s){
    if (s < 0) s = 0;
    var m = Math.floor(s/60), r = Math.floor(s%60);
    return (m<10?"0":"") + m + ":" + (r<10?"0":"") + r;
  }

  /* ── 저장 ── */
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        people:people, topics:topics, bonuses:bonuses, queue:queue, sessions:sessions,
        o:{ rm:$("optRemove").checked, sk:$("optSkipWon").checked, sd:$("optSound").checked,
            sp:$("rSpin").value, dl:$("rDelay").value, tt:tTotal }
      }));
    }catch(e){}
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY), d;
      if (raw){
        d = JSON.parse(raw);
        if (Array.isArray(d.people)) people = d.people.map(normPerson);
        if (Array.isArray(d.topics) && d.topics.length) topics = d.topics;
        if (Array.isArray(d.bonuses) && d.bonuses.length) bonuses = d.bonuses;
        if (Array.isArray(d.queue)) queue = d.queue;
        if (Array.isArray(d.sessions)) sessions = d.sessions;
      } else {
        /* 예전 버전 데이터 이어받기 */
        var old = localStorage.getItem(OLDKEY);
        if (old){
          d = JSON.parse(old);
          if (Array.isArray(d.people)) people = d.people.map(normPerson);
          if (Array.isArray(d.topics) && d.topics.length) topics = d.topics;
          if (Array.isArray(d.winners)) queue = d.winners.map(function(n){
            return { n:String(n), benefit:null, done:false };
          });
        }
      }
      if (d && d.o){
        $("optRemove").checked  = d.o.rm !== false;
        $("optSkipWon").checked = d.o.sk !== false;
        $("optSound").checked   = d.o.sd !== false;
        if (d.o.sp) $("rSpin").value = d.o.sp;
        if (d.o.dl !== undefined && d.o.dl !== null) $("rDelay").value = d.o.dl;
        if (d.o.tt) { tTotal = d.o.tt; tLeft = tTotal; }
      }
    }catch(e){}
  }
  function normPerson(p){
    if (typeof p === "string") return { n:p, w:1 };
    return { n:String(p.n || ""), w:(p.w >= 1 && p.w <= 3) ? p.w : 1 };
  }

  /* ── 소리 ── */
  function ac(){
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    if (!audio) audio = new C();
    if (audio.state === "suspended") audio.resume();
    return audio;
  }
  function blip(f,d,v,type){
    if (!$("optSound").checked) return;
    try{
      var a = ac(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "triangle";
      o.frequency.setValueAtTime(f, a.currentTime);
      g.gain.setValueAtTime(v, a.currentTime);
      g.gain.exponentialRampToValueAtTime(.0008, a.currentTime + d);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + d + .02);
    }catch(e){}
  }
  function tick(){ blip(1240,.035,.03,"square"); }
  function thump(){ blip(138,.34,.075,"sine"); }
  function bell(){
    blip(1046.5,1.1,.075);
    setTimeout(function(){ blip(1318.5,1.3,.06); }, 130);
    setTimeout(function(){ blip(1568,1.5,.045); }, 270);
  }
  function gong(){
    blip(196,1.8,.10,"sine");
    setTimeout(function(){ blip(294,1.6,.07,"sine"); }, 90);
    setTimeout(function(){ blip(392,1.4,.05,"sine"); }, 190);
  }

  /* ── 회전 속도 곡선 ── */
  var EA = .08, EB = .30, EV = 1/(EA/2 + (EB-EA) + (1-EB)/3);
  function ease(p){
    if (p <= 0) return 0;
    if (p >= 1) return 1;
    if (p < EA) return EV*p*p/(2*EA);
    if (p < EB) return EV*(EA/2 + (p-EA));
    var u = (p-EB)/(1-EB);
    return EV*(EA/2 + EB-EA) + EV*(1-EB)*(u - u*u + u*u*u/3);
  }

  /* ── 휠 항목 (가중치 포함) ── */
  function wheelItems(){
    if (bonusFor) return bonuses.map(function(b){ return {label:b, w:1}; });
    if (mode === "topic") return topics.map(function(t){ return {label:t, w:1}; });
    return people.map(function(p){ return {label:p.n, w:p.w}; });
  }
  function slices(){
    var arr = wheelItems(), total = 0, i;
    for (i=0;i<arr.length;i++) total += arr[i].w;
    var out = [], cum = 0;
    for (i=0;i<arr.length;i++){
      var a0 = cum/total*360;
      cum += arr[i].w;
      out.push({ label:arr[i].label, w:arr[i].w, a0:a0, a1:cum/total*360 });
    }
    return out;
  }
  function indexAt(rot, sl){
    var pointed = ((360 - (rot % 360)) % 360 + 360) % 360;
    for (var i=0;i<sl.length;i++) if (pointed >= sl[i].a0 && pointed < sl[i].a1) return i;
    return sl.length - 1;
  }

  function drawWheel(){
    while (rotor.firstChild) rotor.removeChild(rotor.firstChild);
    var sl = slices(), n = sl.length, em = $("empty");

    if (n < 2){
      em.className = "empty";
      em.textContent = bonusFor ? "혜택을 두 개 이상 넣어주세요"
                    : mode === "draw" ? "참가자를 두 분 이상 넣어주세요"
                    : "주제를 두 개 이상 넣어주세요";
    } else em.className = "empty hide";

    spinBtn.disabled = spinning || n < 2;
    spinBtn.textContent = spinning ? "···" : (bonusFor ? "혜 택 뽑 기" : "돌 리 기");

    if (mode === "draw" && !bonusFor && people.length){
      var tot = 0, up = 0;
      people.forEach(function(p){ tot += p.w; if (p.w > 1) up++; });
      $("tally").textContent = up
        ? people.length + "명 참여 · 가중치 합 " + tot + " (우대 " + up + "명)"
        : people.length + "명 참여 · 당첨 확률 " + (100/people.length).toFixed(1) + "%";
    } else $("tally").textContent = "";

    if (n < 2){
      var c = document.createElementNS(NS,"circle");
      c.setAttribute("cx",150); c.setAttribute("cy",150); c.setAttribute("r",138);
      c.setAttribute("fill","#EFE8DA");
      rotor.appendChild(c);
      return;
    }

    var R = 138;
    for (var i=0;i<n;i++){
      var seg = sl[i].a1 - sl[i].a0;
      var a0 = (sl[i].a0 - 90)*Math.PI/180, a1 = (sl[i].a1 - 90)*Math.PI/180;
      var x0 = 150+R*Math.cos(a0), y0 = 150+R*Math.sin(a0);
      var x1 = 150+R*Math.cos(a1), y1 = 150+R*Math.sin(a1);
      var col = TONES[i % TONES.length];
      if (n % TONES.length === 1 && i === n-1) col = TONES[(i+1) % TONES.length];

      var p = document.createElementNS(NS,"path");
      p.setAttribute("d","M 150 150 L "+x0+" "+y0+" A "+R+" "+R+" 0 "+(seg>180?1:0)+" 1 "+x1+" "+y1+" Z");
      p.setAttribute("fill",col.f);
      p.setAttribute("stroke","#FFFDF7"); p.setAttribute("stroke-width",".9");
      rotor.appendChild(p);

      var g = document.createElementNS(NS,"g");
      g.setAttribute("transform","rotate("+((sl[i].a0+sl[i].a1)/2 - 90)+" 150 150)");
      var fs = seg >= 45 ? 14 : seg >= 30 ? 13 : seg >= 22 ? 12 : seg >= 16 ? 10.5 : seg >= 11 ? 9 : 7.5;
      var maxCh = seg >= 45 ? 9 : seg >= 30 ? 8 : seg >= 22 ? 7 : seg >= 16 ? 6 : seg >= 11 ? 5 : 3;

      var t = document.createElementNS(NS,"text");
      t.setAttribute("text-anchor","end"); t.setAttribute("dominant-baseline","middle");
      t.setAttribute("y",150.5); t.setAttribute("x",232);
      t.setAttribute("font-family","Gowun Batang, serif");
      t.setAttribute("font-size",fs); t.setAttribute("font-weight","700");
      t.setAttribute("fill",col.t);
      t.textContent = sl[i].label.length > maxCh ? sl[i].label.slice(0,maxCh)+"…" : sl[i].label;
      g.appendChild(t);

      if (seg >= 11){

  /* 대기열 끌어서 정렬 */
  function attachDrag(li, grip){
    grip.onpointerdown = function(e){
      e.preventDefault();
      var ul = li.parentNode;
      li.className += " dragging";
      try{ grip.setPointerCapture(e.pointerId); }catch(err){}

      grip.onpointermove = function(ev){
        var kids = Array.prototype.slice.call(ul.children);
        for (var i=0;i<kids.length;i++){
          var it = kids[i];
          if (it === li || !it.getBoundingClientRect) continue;
          var r = it.getBoundingClientRect(), mid = r.top + r.height/2;
          var rel = it.compareDocumentPosition(li);
          if (ev.clientY < mid && (rel & 4)){ ul.insertBefore(li, it); break; }
          if (ev.clientY > mid && (rel & 2)){ ul.insertBefore(li, it.nextSibling); break; }
        }
      };
      grip.onpointerup = grip.onpointercancel = function(ev){
        try{ grip.releasePointerCapture(ev.pointerId); }catch(err){}
        grip.onpointermove = null; grip.onpointerup = null; grip.onpointercancel = null;
        li.className = li.className.replace(" dragging","");
        var order = [], ok = true;
        Array.prototype.forEach.call(ul.children, function(k){
          var id = k.getAttribute && k.getAttribute("data-qid");
          if (id === null || id === undefined) { ok = false; return; }
          order.push(queue[parseInt(id,10)]);
        });
        if (ok && order.length === queue.length) queue = order;
        render();
      };
    };
  }

  /* ── 회전 ── */
  function spin(){
    var sl = slices();
    if (spinning || sl.length < 2) return;
    spinning = true; spinBtn.disabled = true; spinBtn.textContent = "···";
    clearResult();

    var secs = parseFloat($("rSpin").value);
    if (!(secs > 0)) secs = 6;
    var dur = secs * 1000;
    var turns = 2 + secs*0.9 + Math.random()*1.2;
    var target = rotation + turns*360 + Math.random()*360;

    var start = rotation, delta = target - start, t0 = nowMs();
    var last = indexAt(start, sl), lastTickAt = 0, done = false;
    var guard = null, iv = null, driver = "raf", frames = 0;

    function finish(){
      if (done) return;
      done = true;
      if (guard) clearTimeout(guard);
      if (iv) clearInterval(iv);
      rotation = target; setRot();
      settle(target, sl);
    }
    guard = setTimeout(finish, dur + 3000);

    function step(){
      if (done) return;
      frames++;
      var t = nowMs(), p = (t - t0)/dur;
      if (!(p > 0)) p = 0;
      if (p >= 1){ finish(); return; }
      rotation = start + delta * ease(p);
      setRot();
      var k = indexAt(rotation, sl);
      if (k !== last){
        last = k;
        if (t - lastTickAt > 40){ lastTickAt = t; tick(); }
      }
      if (driver === "raf") raf(step);
    }
    raf(step);
    setTimeout(function(){
      if (done || frames >= 2) return;
      driver = "timer";
      iv = setInterval(function(){ if (done){ clearInterval(iv); return; } step(); }, 33);
    }, 500);
  }

  function paintTimer(){
    $("tClock").textContent = mmss(tLeft);
    var C = 2*Math.PI*132;
    var frac = tTotal > 0 ? Math.max(0, Math.min(1, tLeft/tTotal)) : 0;
    var arc = $("arc");
    arc.setAttribute("stroke-dasharray", C.toFixed(2));
    arc.setAttribute("stroke-dashoffset", (C*(1-frac)).toFixed(2));
    arc.setAttribute("stroke", tLeft <= 30 ? "#BE3B2E" : "#4A8073");

    $("tState").textContent = tRunning ? "진 행 중" : (tLeft <= 0 ? "종 료" : "");
  }
  function stopTimer(){

    if (tLeft <= 0) tLeft = tTotal;
    tRunning = true;
    tEndAt = Date.now() + tLeft*1000;
    if (tTick) clearInterval(tTick);
    tTick = setInterval(function(){
      var prev = Math.ceil(tLeft);
      tLeft = (tEndAt - Date.now())/1000;
      var cur = Math.ceil(tLeft);
      if (tLeft <= 30 && !tWarned){ tWarned = true; blip(880,.5,.07); }
      if (cur !== prev && cur <= 5 && cur > 0) blip(660,.14,.06);
      if (tLeft <= 0){ tLeft = 0; stopTimer(); gong(); }
      paintTimer();
    }, 200);
    paintTimer();
  }

      var k = v.toLowerCase();

      seen[k] = 1; out.push(v);

    function fb(){
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }catch(e){}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(done, fb);
    else fb();
  }

  $("bDraft").onkeydown = function(e){ if (e.key === "Enter") $("bAdd").click(); };
  $("resetBonus").onclick = function(){ bonuses = DEFAULT_BONUS.slice(); render(); };

  /* 파괴적 동작은 확인 창 대신 '두 번 누르기'로 처리한다.
     브라우저가 확인 창을 차단해도 항상 동작한다. */
  function armed(btn, warnLabel, fn){
    btn.onclick = function(){
      function disarm(){
        btn._armed = false;
        btn.textContent = btn._lbl;
        btn.className = btn._cls;
      }
      if (btn._armed){
        if (btn._t) clearTimeout(btn._t);
        disarm();
        fn();
        return;
      }
      btn._lbl = btn.textContent;
      btn._cls = btn.className;
      btn._armed = true;
      btn.textContent = warnLabel;
      btn.className = btn._cls + " arm";
      btn._t = setTimeout(disarm, 4000);
    };
  }

  /* ── 방송 정리 동작 ── */
  $("histToggle").onclick = function(){
    var open = $("histView").className.indexOf("hide") === -1;
    $("histView").className = open ? "hide" : "";
    this.textContent = open ? "지난 기록" : "접기";
  };
  $("copySum").onclick = function(){
    copyText(summaryOf(people.length + queue.length, queue, today()), this, "요약 복사");
  };
  armed($("closeShow"), "한 번 더 누르면 마감", function(){
    if (!queue.length && !people.length) return;
    if (queue.length){
      sessions.unshift({ d:today(), j:people.length + queue.length, q:queue.slice() });
      if (sessions.length > 20) sessions.pop();
    }
    people = []; queue = []; lastWin = null; bonusFor = null;
    tName = ""; stopTimer(); tLeft = tTotal; tWarned = false;
    $("filter").value = ""; $("warn").textContent = "";
    clearResult(); paintTimer(); render();
    $("todayLine").textContent = "마감했습니다 · 지난 기록에 저장되었습니다";
  });
  armed($("clearHist"), "한 번 더 누르면 삭제", function(){
    sessions = []; render();
  });

  /* ── 모드 ── */
  function setMode(m){
    cancelWait();
    mode = m;
    if (m !== "draw") bonusFor = null;
    $("mDraw").className  = m === "draw"  ? "on" : "";
    $("mTopic").className = m === "topic" ? "on" : "";
    $("mTimer").className = m === "timer" ? "on" : "";
    $("drawPanel").className  = m === "draw"  ? "panel" : "panel hide";
    $("bonusPanel").className = m === "draw"  ? "panel" : "panel hide";
    $("topicPanel").className = m === "topic" ? "panel" : "panel hide";
    $("tunePanel").className = m === "timer" ? "panel tune hide" : "panel tune";
    $("wheelStage").className = m === "timer" ? "hide" : "";
    $("timerStage").className = m === "timer" ? "" : "hide";
    if (m === "timer"){ paintTimer(); drawPresets(); }
    clearResult();
    render();
  }
  $("mDraw").onclick  = function(){ setMode("draw"); };
  $("mTopic").onclick = function(){ setMode("topic"); };
  $("mTimer").onclick = function(){ setMode("timer"); };

  spinBtn.onclick = function(){
    if (spinning && nowMs() - spinStartedAt > 20000){
      spinning = false; spinBtn.disabled = false;
    }
    if (spinning || slices().length < 2) return;
    spinStartedAt = nowMs();
    spin();
  };
  $("wheel").onclick = function(){
    if (document.body.classList.contains("stage-mode")) spinBtn.onclick();
  };
  $("stageBtn").onclick = function(){
    document.body.classList.toggle("stage-mode");
    this.textContent = document.body.classList.contains("stage-mode") ? "설정 열기" : "방송 모드";
  };
  document.addEventListener("keydown", function(e){
    if (e.code !== "Space" && e.key !== " ") return;
    var t = e.target.tagName;
    if (t === "INPUT" || t === "TEXTAREA" || t === "BUTTON") return;
    e.preventDefault();
    if (mode === "timer") $("tToggle").click(); else spinBtn.onclick();
  });
  ["optRemove","optSkipWon","optSound"].forEach(function(id){ $(id).onchange = save; });
  function syncTune(){
    $("vSpin").textContent = parseFloat($("rSpin").value).toFixed(1) + "초";
    var d = parseFloat($("rDelay").value);
    $("vDelay").textContent = d === 0 ? "없음" : d.toFixed(1) + "초";
  }
  $("rSpin").oninput  = function(){ syncTune(); save(); };
  $("rDelay").oninput = function(){ syncTune(); save(); };

  load();
  syncTune();
  drawPresets();
  paintTimer();
  setMode("draw");
})();
</script>
</body>
</html>
